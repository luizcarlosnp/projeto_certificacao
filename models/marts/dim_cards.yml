version: 2

models:
  - name: dim_card
    description: >
      Uma tabela que combina informações de cartões de crédito e seus respectivos donos. 
      Esta tabela é materializada como uma tabela física e junta dados das tabelas de estágio `stg_erp__creditcard` e
      `stg_erp__personcreditcard`.
    columns:
      - name: credit_card_id
        description: Identificador único para o cartão de crédito.
      - name: card_type
        description: Tipo do cartão de crédito
      - name: exp_month
        description: Mês de expiração do cartão de crédito.
      - name: exp_year
        description: Ano de expiração do cartão de crédito.
      - name: business_entity_id
        description: Identificador único para a entidade empresarial associada ao cartão de crédito.
