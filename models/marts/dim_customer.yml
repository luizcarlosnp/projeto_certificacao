version: 2

models:
  - name: dim_customer
    description: >
      Uma tabela que combina detalhes de endereço, informações de estado/província e dados de território de vendas. 
      Esta tabela é materializada como uma tabela física e junta dados das tabelas de estágio `stg_erp__address`,
      `stg_erp__stateprovince` e `stg_erp__salesterritory`.
    columns:
      - name: address_id
        description: Identificador único para o endereço.
      - name: address_line_1
        description: Linha principal do endereço.
      - name: address_line_2
        description: Linha secundária do endereço (se disponível).
      - name: city
        description: Nome da cidade do endereço.
      - name: postal_code
        description: Código postal do endereço.
      - name: spatial_location
        description: Dados espaciais associados ao endereço.
      - name: state_province_code
        description: Código que representa o estado ou província.
      - name: state_province_name
        description: Nome completo do estado ou província.
      - name: territory_name
        description: Nome do território de vendas associado ao estado ou província.
      - name: territory_id
        description: Identificador único do território de vendas.
      - name: sales_ytd
        description: Vendas acumuladas no ano para o território.
      - name: sales_last_year
        description: Vendas do território no ano anterior.
      - name: cost_ytd
        description: Custo acumulado no ano para o território.
      - name: cost_last_year
        description: Custo do território no ano anterior.
        