version: 2

models:
  - name: int_product
    description: >
      Uma tabela que contém detalhes sobre os produtos, incluindo informações gerais, medidas e datas relevantes. 
      Esta tabela é materializada como uma tabela física e utiliza os dados da tabela de estágio `stg_erp__product`.
    columns:
      - name: product_name
        description: Nome do produto.
      - name: product_id
        description: Identificador único para o produto.
      - name: product_number
        description: Número de identificação do produto.
      - name: make_flag
        description: Indicador se o produto é fabricado internamente.
      - name: finished_goods_flag
        description: Indicador se o produto é um bem acabado.
      - name: color
        description: Cor do produto.
      - name: safety_stock_level
        description: Nível de estoque de segurança para o produto.
      - name: reorder_point
        description: Ponto de reabastecimento para o produto.
      - name: standard_cost
        description: Custo padrão do produto.
      - name: list_price
        description: Preço de lista do produto.
      - name: size
        description: Tamanho do produto.
      - name: size_unit_measure_code
        description: Código da unidade de medida para o tamanho do produto.
      - name: weight_unit_measure_code
        description: Código da unidade de medida para o peso do produto.
      - name: weight
        description: Peso do produto.
      - name: days_to_manufacture
        description: Dias necessários para fabricar o produto.
      - name: product_line
        description: Linha de produto à qual este pertence.
      - name: class
        description: Classe do produto.
      - name: style
        description: Estilo do produto.
      - name: product_subcategory_id
        description: Identificador único da subcategoria do produto.
      - name: product_model_id
        description: Identificador único do modelo do produto.
      - name: sell_start_date
        description: Data de início das vendas do produto.
      - name: sell_end_date
        description: Data de fim das vendas do produto.
      - name: discontinued_date
        description: Data em que o produto foi descontinuado.
      - name: row_guid
        description: GUID da linha do produto.
      - name: modified_date
        description: Data da última modificação no registro do produto.
