version: 2

models:
  - name: int_sales
    description: >
      Uma tabela que consolida métricas de pedidos de vendas, incluindo informações sobre clientes, produtos, endereços,
      e razões associadas às vendas. 
      Esta tabela é materializada como uma tabela física e junta dados das tabelas de estágio `stg_erp__salesorderheader`,
      `stg_erp__salesorderdetail`, `stg_erp__address`, `stg_erp__salesorderheadersalesreason` e `stg_erp__salesreason`.
    columns:
      - name: order_id
        description: Identificador único do pedido de venda.
      - name: order_date
        description: Data do pedido de venda.
      - name: year
        description: Ano de realização do pedido.
      - name: month
        description: Mês de realização do pedido.
      - name: customer_id
        description: Identificador único do cliente associado ao pedido.
      - name: territory_id
        description: Identificador único do território associado ao pedido.
      - name: billing_address_id
        description: Identificador único do endereço de cobrança.
      - name: shipping_address_id
        description: Identificador único do endereço de entrega.
      - name: shipping_method_id
        description: Identificador único do método de envio.
      - name: subtotal
        description: Subtotal do pedido, excluindo taxas e frete.
      - name: tax_amount
        description: Valor total de taxas aplicadas ao pedido.
      - name: freight
        description: Valor do frete para o pedido.
      - name: comment
        description: Comentários associados ao pedido.
      - name: status
        description: Status atual do pedido.
      - name: credit_card_id
        description: Identificador único do cartão de crédito usado no pedido.
      - name: order_detail_id
        description: Identificador único do detalhe do pedido.
      - name: product_id
        description: Identificador único do produto associado ao pedido.
      - name: special_offer_id
        description: Identificador único da oferta especial aplicada ao pedido.
      - name: order_quantity
        description: Quantidade do produto no pedido.
      - name: unit_price
        description: Preço unitário do produto.
      - name: unit_discount
        description: Desconto unitário aplicado ao produto.
      - name: total_deal_value
        description: Valor total do negócio (quantidade x preço unitário).
      - name: gross_revenue
        description: Receita bruta gerada pelo pedido.
      - name: total_discount
        description: Valor total do desconto aplicado ao pedido.
      - name: shipping_city
        description: Cidade do endereço de entrega.
      - name: shipping_state_province_id
        description: Identificador do estado/província do endereço de entrega.
      - name: shipping_postal_code
        description: Código postal do endereço de entrega.
      - name: reason_type
        description: Tipo de razão associada ao pedido.
